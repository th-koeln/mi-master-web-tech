  <script src="{{ '/assets/libs/gsap/SplitText.min.js' | relative_url }}"></script>
  <script defer src="{{ '/assets/js/eyecandy.js' | relative_url }}"></script>
  <script defer src="{{ '/assets/js/web-tech.js' | relative_url }}"></script>
</head>
